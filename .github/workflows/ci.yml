name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de --selftest ici : il lit les écrans réels, et le runner n'en a pas.
      - name: Build
        shell: powershell
        run: ./build.ps1
